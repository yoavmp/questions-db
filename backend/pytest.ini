[pytest]
testpaths = tests
# WP17 contract/category/DTO/adapter tests + WP18 exam-generation job tests.
# Every test uses a TEMPORARY sqlite DB (pytest tmp_path) and an injected fake
# provider with sockets blocked -- backend/src/database/app.db is never opened or
# mutated, and no provider/network call is ever made. Job state is written under
# a tmp EXAM_JOBS_ROOT, never <repo>/artifacts/. Tests that need the generator's
# real context data self-skip if the exam_generator submodule / its deps / the
# local Data/ are absent.
